name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: lint + typecheck + test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,examples]" python-multipart
      - name: Lint
        run: |
          ruff check src tests examples
          ruff format --check src tests examples
      - name: Type check
        run: mypy
      - name: Test
        run: pytest
      - name: Example imports
        run: python -c "import examples.fastapi_checkout.main"
        env:
          BKASH_APP_KEY: ci
          BKASH_APP_SECRET: ci
          BKASH_USERNAME: ci
          BKASH_PASSWORD: ci

  build:
    name: build distribution
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
